<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 636" width="960" height="636" role="img" aria-labelledby="t d"><title id="t">Supported hardware</title><desc id="d">An ESP32-S3 board with 8 MB octal PSRAM and two USB-C ports, powered by a 5 V USB charger. Built-in 2.4 GHz Wi-Fi. Everything else is optional: a computer on the COM port for flashing and logs; on the pins a microSD log recorder, W5500 Ethernet (SPI) or a 4G modem with a SIM (UART); on the USB port one device, a 4G USB stick or modem with a SIM, or a USB Ethernet adapter or phone tethering, connected through an OTG Y-cable whose power input takes the charger so one charger powers both. W5500, UART modems and USB Ethernet are implemented but not yet tested on real hardware.</desc><style>text{font-family:Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.hw-bg{fill:#0A0F0C}.hw-box,.hw-board{fill:#111814;stroke:#2E4A3B}.hw-opt{fill:#111814;stroke:#8DA397;stroke-dasharray:5 4}.hw-group{fill:none;stroke:#8DA397;stroke-dasharray:3 5}.hw-chip-pkg{fill:#0E1511;stroke:#2E4A3B}.hw-chip{fill:#0A0F0C;stroke:#1FC97A;stroke-width:1.5}.hw-port{fill:#1C2A22;stroke:#2E4A3B}.hw-port-usb{stroke:#1FC97A}.hw-wire{fill:none;stroke:#8DA397;stroke-width:2}.hw-power{stroke:#1FC97A;stroke-width:3}.hw-radio{fill:none;stroke:#8DA397;stroke-width:2;stroke-dasharray:2 5}.hw-alt{stroke:#1FC97A;stroke-dasharray:6 5}.hw-y{fill:#0A0F0C;stroke:#1FC97A;stroke-width:3}.hw-hit{fill:transparent}.hw-t{font-size:14px;font-weight:600;fill:#E3ECE6}.hw-h{font-size:15px;font-weight:650;fill:#E3ECE6}.hw-s{font-size:12.5px;fill:#8DA397}.hw-m{font-size:13.5px;fill:#8DA397}.hw-z{font-size:11.5px;font-weight:600;letter-spacing:2px;fill:#8DA397}.hw-port-t{font-size:11.5px;font-weight:700;fill:#E3ECE6}.hw-y-t{font-size:13px;font-weight:700;fill:#E3ECE6}.hw-badge-warn{fill:#F5A524}.hw-pwr-t{font-size:11px;font-weight:700;fill:#1FC97A}.hw-badge-t{font-size:10.5px;font-weight:700;letter-spacing:.6px;fill:#0A0F0C}</style><rect class="hw-bg" width="960" height="636" rx="16"/><text class="hw-z" x="40" y="52">HARDWARE</text><text class="hw-m" x="40" y="76">One ESP32-S3 board; add only what you need.</text><rect class="hw-badge-warn" x="620" y="40" width="113" height="20" rx="10"/><text class="hw-badge-t" x="676.3" y="54" text-anchor="middle">NOT YET TESTED</text><text class="hw-s" x="742" y="54">implemented</text><rect class="hw-opt" x="834" y="40" width="26" height="20" rx="5"/><text class="hw-s" x="868" y="54">optional</text><path class="hw-radio" d="M300 170H262"/><path class="hw-wire" d="M390 342V410H262"/><path class="hw-wire hw-power hw-alt" d="M262 532H556"/><path class="hw-wire hw-power hw-alt" d="M570 342V518"/><path class="hw-wire hw-power hw-alt" d="M584 532H686"/><path class="hw-wire" d="M660 140H720"/><path class="hw-wire" d="M660 217H720"/><path class="hw-wire" d="M660 295H720"/><text class="hw-s" x="578" y="420">USB-C plug</text><text class="hw-s" x="578" y="436">data + 5 V</text><text class="hw-pwr-t" x="272" y="524">OR: Y-cable for USB SIM / Ethernet</text><text class="hw-s" x="596" y="524">USB-A</text><text class="hw-s" x="398" y="380">flash · logs</text><text class="hw-s" x="668" y="132">SDMMC</text><text class="hw-s" x="668" y="209">SPI</text><text class="hw-s" x="668" y="287">UART</text><text class="hw-z" x="720" y="102">ON THE PINS (OPTIONAL)</text><g><rect class="hw-board" x="300" y="110" width="360" height="222" rx="10"/><rect class="hw-chip-pkg" x="320" y="134" width="154" height="104" rx="8"/><rect class="hw-chip" x="340" y="154" width="114" height="64" rx="4"/><text class="hw-t" x="397" y="191" text-anchor="middle">ESP32-S3</text><rect class="hw-chip-pkg" x="494" y="134" width="146" height="46" rx="6"/><text class="hw-t" x="567.0" y="154" text-anchor="middle">PSRAM</text><text class="hw-s" x="567.0" y="171" text-anchor="middle">8 MB octal</text><rect class="hw-chip-pkg" x="494" y="192" width="146" height="46" rx="6"/><text class="hw-t" x="567.0" y="212" text-anchor="middle">Flash</text><text class="hw-s" x="567.0" y="229" text-anchor="middle">8–16 MB</text><text class="hw-h" x="320" y="272">ESP32-S3 board</text><text class="hw-s" x="320" y="292">any board with 8 MB octal PSRAM</text><rect class="hw-port" x="362" y="320" width="56" height="22" rx="6"/><text class="hw-port-t" x="390" y="335" text-anchor="middle">COM</text><text class="hw-pwr-t" x="422" y="354">5 V · flash</text><rect class="hw-port hw-port-usb" x="542" y="320" width="56" height="22" rx="6"/><text class="hw-port-t" x="570" y="335" text-anchor="middle">USB</text><text class="hw-pwr-t" x="602" y="354">5 V · flash</text></g><g><rect class="hw-box" x="40" y="130" width="222" height="80" rx="10"/><text class="hw-h" x="56" y="160">Wi-Fi 2.4 GHz</text><text class="hw-s" x="56" y="182">uplink and own access point</text><text class="hw-s" x="56" y="199">built in</text></g><g><rect class="hw-opt" x="40" y="376" width="222" height="70" rx="10"/><text class="hw-h" x="56" y="404">Computer</text><text class="hw-s" x="56" y="426">optional · powers, flashes, logs</text></g><g><rect class="hw-box" x="40" y="492" width="222" height="80" rx="10"/><text class="hw-h" x="56" y="520">5 V USB charger</text><text class="hw-s" x="56" y="541">required · plug into COM or USB</text><text class="hw-s" x="56" y="558">OR Y-cable: USB SIM / Ethernet</text></g><g><rect class="hw-hit" x="530" y="492" width="80" height="96" rx="12"/><circle class="hw-y" cx="570" cy="532" r="15"/><text class="hw-y-t" x="570" y="537" text-anchor="middle">Y</text><text class="hw-s" x="570" y="568" text-anchor="middle">OTG Y-cable</text><text class="hw-s" x="570" y="584" text-anchor="middle">only for USB SIM / Ethernet</text></g><rect class="hw-group" x="686" y="444" width="254" height="168" rx="12"/><text class="hw-s" x="700" y="466">USB device (optional) · one of:</text><g><rect class="hw-opt" x="698" y="478" width="230" height="58" rx="10"/><text class="hw-h" x="712" y="501">4G USB stick or modem</text><text class="hw-s" x="712" y="521">SIM · main or backup uplink</text></g><g><rect class="hw-opt" x="698" y="544" width="230" height="58" rx="10"/><text class="hw-h" x="712" y="566">USB Ethernet or tethering</text><rect class="hw-badge-warn" x="712" y="574" width="113" height="20" rx="10"/><text class="hw-badge-t" x="768.3" y="588" text-anchor="middle">NOT YET TESTED</text></g><g><rect class="hw-opt" x="720" y="112" width="210" height="58" rx="10"/><text class="hw-h" x="736" y="137">microSD</text><text class="hw-s" x="736" y="157">log recorder</text></g><g><rect class="hw-opt" x="720" y="184" width="210" height="66" rx="10"/><text class="hw-h" x="736" y="207">W5500 Ethernet</text><rect class="hw-badge-warn" x="736" y="220" width="113" height="20" rx="10"/><text class="hw-badge-t" x="792.3" y="234" text-anchor="middle">NOT YET TESTED</text></g><g><rect class="hw-opt" x="720" y="262" width="210" height="66" rx="10"/><text class="hw-h" x="736" y="285">4G modem · SIM</text><rect class="hw-badge-warn" x="736" y="298" width="113" height="20" rx="10"/><text class="hw-badge-t" x="792.3" y="312" text-anchor="middle">NOT YET TESTED</text></g></svg>
