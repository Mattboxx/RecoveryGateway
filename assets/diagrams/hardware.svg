<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d"><title id="t">Supported hardware</title><desc id="d">An ESP32-S3 N16R8 or N8R8 board with two USB-C ports. Tested 4G setup: one 5 V charger on an OTG Y-cable powers both the board and a TCL LinkKey IK41 SIM stick; the cable plug goes into the board&#x27;s USB port, the stick into the cable&#x27;s socket. A computer on the COM port is optional, for flashing and logs. Built-in 2.4 GHz Wi-Fi. Optional microSD log recorder; W5500 Ethernet and a modem on UART pins are implemented but not yet tested on real hardware.</desc><style>text{font-family:Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.hw-bg{fill:#0A0F0C}.hw-box,.hw-board{fill:#111814;stroke:#2E4A3B}.hw-opt{fill:#111814;stroke:#8DA397;stroke-dasharray:5 4}.hw-chip-pkg{fill:#0E1511;stroke:#2E4A3B}.hw-chip{fill:#0A0F0C;stroke:#1FC97A;stroke-width:1.5}.hw-port{fill:#1C2A22;stroke:#2E4A3B}.hw-port-usb{stroke:#1FC97A}.hw-wire{fill:none;stroke:#8DA397;stroke-width:2}.hw-power{stroke:#1FC97A;stroke-width:3}.hw-radio{fill:none;stroke:#8DA397;stroke-width:2;stroke-dasharray:2 5}.hw-y{fill:#0A0F0C;stroke:#1FC97A;stroke-width:3}.hw-hit{fill:transparent}.hw-t{font-size:14px;font-weight:600;fill:#E3ECE6}.hw-h{font-size:15px;font-weight:650;fill:#E3ECE6}.hw-s,.hw-m{font-size:12.5px;fill:#8DA397}.hw-m{font-size:13.5px}.hw-z{font-size:11.5px;font-weight:600;letter-spacing:2px;fill:#8DA397}.hw-port-t,.hw-y-t{font-size:11.5px;font-weight:700;fill:#E3ECE6}.hw-y-t{font-size:13px}.hw-badge-ok{fill:#1FC97A}.hw-badge-warn{fill:#F5A524}.hw-badge-t{font-size:10.5px;font-weight:700;letter-spacing:.6px;fill:#0A0F0C}</style><rect class="hw-bg" width="960" height="600" rx="16"/><text class="hw-z" x="40" y="52">HARDWARE</text><text class="hw-m" x="40" y="76">Tested setup with a 4G SIM stick: one charger powers everything.</text><rect class="hw-badge-ok" x="600" y="40" width="53" height="20" rx="10"/><text class="hw-badge-t" x="626.7" y="54" text-anchor="middle">TESTED</text><text class="hw-s" x="664" y="54">on real hardware</text><rect class="hw-badge-warn" x="600" y="66" width="113" height="20" rx="10"/><text class="hw-badge-t" x="656.3" y="80" text-anchor="middle">NOT YET TESTED</text><text class="hw-s" x="728" y="80">implemented</text><rect class="hw-opt" x="820" y="40" width="26" height="20" rx="5"/><text class="hw-s" x="854" y="54">optional</text><path class="hw-radio" d="M300 170H262"/><path class="hw-wire" d="M390 342V410H262"/><path class="hw-wire hw-power" d="M262 520H556"/><path class="hw-wire hw-power" d="M570 342V506"/><path class="hw-wire hw-power" d="M584 520H698"/><path class="hw-wire" d="M660 140H720"/><path class="hw-wire" d="M660 217H720"/><path class="hw-wire" d="M660 295H720"/><text class="hw-s" x="578" y="430">USB-C plug</text><text class="hw-s" x="578" y="446">data + 5 V</text><text class="hw-s" x="300" y="512">power input</text><text class="hw-s" x="600" y="512">USB-A socket</text><text class="hw-s" x="398" y="380">flash · logs</text><text class="hw-s" x="668" y="132">SDMMC</text><text class="hw-s" x="668" y="209">SPI</text><text class="hw-s" x="668" y="287">UART</text><g><rect class="hw-board" x="300" y="110" width="360" height="222" rx="10"/><rect class="hw-chip-pkg" x="326" y="146" width="150" height="112" rx="8"/><rect class="hw-chip" x="346" y="166" width="110" height="72" rx="4"/><text class="hw-t" x="401" y="207" text-anchor="middle">ESP32-S3</text><rect class="hw-chip-pkg" x="494" y="146" width="140" height="48" rx="6"/><text class="hw-t" x="564" y="166" text-anchor="middle">PSRAM</text><text class="hw-s" x="564" y="184" text-anchor="middle">8 MB octal</text><rect class="hw-chip-pkg" x="494" y="210" width="140" height="48" rx="6"/><text class="hw-t" x="564" y="230" text-anchor="middle">Flash</text><text class="hw-s" x="564" y="248" text-anchor="middle">8–16 MB</text><text class="hw-h" x="326" y="286">ESP32-S3 N16R8 or N8R8</text><text class="hw-s" x="326" y="306">tested: DevKitC-1 N16R8</text><rect class="hw-port" x="362" y="322" width="56" height="22" rx="6"/><text class="hw-port-t" x="390" y="337" text-anchor="middle">COM</text><rect class="hw-port hw-port-usb" x="542" y="322" width="56" height="22" rx="6"/><text class="hw-port-t" x="570" y="337" text-anchor="middle">USB</text></g><g><rect class="hw-box" x="40" y="130" width="222" height="80" rx="10"/><text class="hw-h" x="56" y="160">Wi-Fi 2.4 GHz</text><text class="hw-s" x="56" y="182">uplink and own access point</text><text class="hw-s" x="56" y="199">built in</text></g><g><rect class="hw-opt" x="40" y="376" width="222" height="70" rx="10"/><text class="hw-h" x="56" y="404">Computer (optional)</text><text class="hw-s" x="56" y="426">flash and logs via COM</text></g><g><rect class="hw-box" x="40" y="484" width="222" height="76" rx="10"/><text class="hw-h" x="56" y="512">5 V charger</text><text class="hw-s" x="56" y="533">≥ 2.5 A · powers board + stick</text></g><g><rect class="hw-hit" x="530" y="480" width="80" height="80" rx="12"/><circle class="hw-y" cx="570" cy="520" r="15"/><text class="hw-y-t" x="570" y="525" text-anchor="middle">Y</text><text class="hw-s" x="570" y="556" text-anchor="middle">OTG Y-cable</text></g><g><rect class="hw-box" x="698" y="470" width="232" height="100" rx="10"/><text class="hw-h" x="714" y="498">4G SIM stick</text><text class="hw-t" x="714" y="518">TCL LinkKey IK41</text><text class="hw-s" x="714" y="537">main or backup uplink</text><rect class="hw-badge-ok" x="714" y="544" width="53" height="20" rx="10"/><text class="hw-badge-t" x="740.7" y="558" text-anchor="middle">TESTED</text></g><g><rect class="hw-opt" x="720" y="112" width="210" height="58" rx="10"/><text class="hw-h" x="736" y="137">microSD</text><text class="hw-s" x="736" y="157">log recorder</text></g><g><rect class="hw-opt" x="720" y="184" width="210" height="66" rx="10"/><text class="hw-h" x="736" y="207">W5500 Ethernet</text><rect class="hw-badge-warn" x="736" y="220" width="113" height="20" rx="10"/><text class="hw-badge-t" x="792.3" y="234" text-anchor="middle">NOT YET TESTED</text></g><g><rect class="hw-opt" x="720" y="262" width="210" height="66" rx="10"/><text class="hw-h" x="736" y="285">Modem on UART pins</text><rect class="hw-badge-warn" x="736" y="298" width="113" height="20" rx="10"/><text class="hw-badge-t" x="792.3" y="312" text-anchor="middle">NOT YET TESTED</text></g></svg>
